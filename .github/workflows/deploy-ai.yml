name: Deploy AI Service (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "apps/ai-service/**"

jobs:
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    # Only run when GCP secrets are configured
    if: ${{ vars.GCP_CONFIGURED == 'true' }}
    environment: production
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image
        run: |
          gcloud builds submit apps/ai-service \
            --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/neuroclass-ai:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy neuroclass-ai \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/neuroclass-ai:${{ github.sha }} \
            --region asia-south1 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 50 \
            --no-allow-unauthenticated
